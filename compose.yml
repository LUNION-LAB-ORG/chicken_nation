services:
  chicken-nation-web-prod:
    env_file:
      - .env
    build:
      context: .
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_API_BACKEND_URL: ${NEXT_PUBLIC_API_BACKEND_URL}
        NEXT_PUBLIC_API_FILE_URL: ${NEXT_PUBLIC_API_FILE_URL}
        NEXT_PUBLIC_CLOUDFRONT_URL: ${NEXT_PUBLIC_CLOUDFRONT_URL}
        NEXT_PUBLIC_PLAY_STORE_LINK: ${NEXT_PUBLIC_PLAY_STORE_LINK}
        NEXT_PUBLIC_APP_STORE_LINK: ${NEXT_PUBLIC_APP_STORE_LINK}
        NEXT_PUBLIC_APP_SCHEMA: ${NEXT_PUBLIC_APP_SCHEMA}
        # Clé fixe des actions serveur (cf. Dockerfile), lue dans .env.
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    image: chicken-nation-web-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_PORT}:3000"
    # Durcissement (incident du 19/09 : un programme déposé dans /tmp puis lancé
    # par le serveur) : /tmp en mémoire et sans exécution, aucun privilège
    # gagné, aucune capacité Linux, nombre de processus et mémoire bornés.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 1g
    volumes:
      # Images optimisées par next/image gardées d'un déploiement à l'autre :
      # sinon chaque mise en ligne les refait toutes à la première visite.
      - cache-images:/app/.next/cache/images

volumes:
  cache-images:
